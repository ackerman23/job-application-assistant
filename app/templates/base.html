<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102a43">
    <title>{% block title %}Job Application Assistant{% endblock %}</title>
    <style>
      :root {
        --ink-950: #102a43;
        --ink-800: #243b53;
        --ink-700: #334e68;
        --ink-600: #486581;
        --ink-400: #829ab1;
        --line: #d9e2ec;
        --canvas: #f5f7fa;
        --surface: #ffffff;
        --surface-muted: #f8fafc;
        --teal-700: #147d85;
        --teal-800: #0b6670;
        --teal-100: #d8f3f0;
        --blue-700: #175cd3;
        --blue-100: #eaf2ff;
        --amber-700: #9a6700;
        --amber-100: #fff3c4;
        --red-700: #b42318;
        --red-100: #fee4e2;
        --violet-700: #6938ef;
        --violet-100: #f4f3ff;
        --radius-lg: 1.25rem;
        --radius-md: 0.8rem;
        --shadow-sm: 0 1px 2px rgba(16, 42, 67, 0.06), 0 2px 8px rgba(16, 42, 67, 0.04);
        --shadow-md: 0 14px 34px rgba(16, 42, 67, 0.08);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        min-width: 320px;
        margin: 0;
        color: var(--ink-950);
        background: var(--canvas);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }

      a { color: inherit; }
      button, input, textarea { font: inherit; }
      button { cursor: pointer; }
      :focus-visible { outline: 3px solid rgba(23, 92, 211, 0.42); outline-offset: 3px; }

      .skip-link {
        position: fixed;
        z-index: 10;
        top: 0.75rem;
        left: 0.75rem;
        padding: 0.65rem 0.9rem;
        color: #fff;
        background: var(--ink-950);
        border-radius: 0.5rem;
        transform: translateY(-180%);
      }
      .skip-link:focus { transform: translateY(0); }

      .site-header { background: var(--ink-950); color: #fff; }
      .site-header__inner, .page-shell {
        width: min(1180px, calc(100% - 2rem));
        margin: 0 auto;
      }
      .site-header__inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        min-height: 4.5rem;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.7rem;
        color: #fff;
        text-decoration: none;
        font-weight: 760;
        letter-spacing: -0.02em;
      }
      .brand-mark {
        display: grid;
        width: 2rem;
        height: 2rem;
        place-items: center;
        color: var(--ink-950);
        background: var(--teal-100);
        border-radius: 0.55rem;
        font-size: 0.9rem;
        font-weight: 850;
      }
      .site-nav { display: flex; align-items: center; gap: 0.25rem; }
      .site-nav a {
        padding: 0.45rem 0.65rem;
        color: #d9e2ec;
        border-radius: 0.45rem;
        font-size: 0.9rem;
        text-decoration: none;
      }
      .site-nav a:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }

      .page-shell { padding: clamp(2rem, 4vw, 4rem) 0 4rem; }
      .eyebrow {
        margin: 0 0 0.55rem;
        color: var(--teal-700);
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.7rem;
        padding: 0.65rem 1rem;
        border: 1px solid transparent;
        border-radius: 0.65rem;
        font-weight: 750;
        line-height: 1.2;
        text-decoration: none;
        transition: transform 160ms ease, box-shadow 160ms ease, background-color 160ms ease;
      }
      .button:hover { transform: translateY(-1px); }
      .button--primary { color: #fff; background: var(--teal-700); box-shadow: 0 7px 16px rgba(20, 125, 133, 0.2); }
      .button--primary:hover { background: var(--teal-800); }
      .button--secondary { color: var(--ink-800); background: #fff; border-color: var(--line); }
      .button--secondary:hover { background: var(--surface-muted); box-shadow: var(--shadow-sm); }

      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
      }
      @media (max-width: 560px) {
        .site-header__inner { min-height: 4rem; }
        .site-nav a:last-child { display: none; }
      }
    </style>
    {% block styles %}{% endblock %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="/" aria-label="Job Application Assistant home">
          <span class="brand-mark" aria-hidden="true">JA</span>
          <span>Job Application Assistant</span>
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="/dashboard">Workspace</a>
          <a href="/health">Health</a>
        </nav>
      </div>
    </header>
    <main id="main-content" class="page-shell">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
